name: Daily Discover public feeds
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discover-daily-data
  cancel-in-progress: false
jobs:
  refresh:
    # Inert until separately approved and enabled. Never run on private repositories or forks.
    if: >-
      github.repository == 'LJAguil/laneslair' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      vars.DISCOVER_DAILY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Persist request reservations
        run: node scripts/discover/daily-update.mjs prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCOVER_DAILY_ENABLED: ${{ vars.DISCOVER_DAILY_ENABLED }}
      - name: Fetch subscriptions and save public metadata
        run: node scripts/discover/daily-update.mjs fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCOVER_DAILY_ENABLED: ${{ vars.DISCOVER_DAILY_ENABLED }}
