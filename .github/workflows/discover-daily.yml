name: Refresh Discover
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Refresh saved feeds; first-time setup uses controlled-pilot'
        type: choice
        default: refresh-now
        options:
          - inspect-only
          - controlled-pilot
          - refresh-now
permissions:
  contents: read
concurrency:
  group: discover-daily-data
  cancel-in-progress: false
jobs:
  refresh:
    # A first manual pilot does not enable the recurring schedule or production reader.
    if: >-
      github.repository == 'LJAguil/laneslair' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && vars.DISCOVER_DAILY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && (inputs.mode == 'controlled-pilot' || inputs.mode == 'refresh-now') && vars.DISCOVER_DAILY_ENABLED != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      DISCOVER_DAILY_ENABLED: ${{ vars.DISCOVER_DAILY_ENABLED }}
      DISCOVER_RUN_MODE: ${{ inputs.mode }}
      DISCOVER_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Persist request reservations
        shell: bash
        run: node scripts/discover/daily-update.mjs prepare | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Fetch subscriptions and save public metadata
        shell: bash
        run: node scripts/discover/daily-update.mjs fetch | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
